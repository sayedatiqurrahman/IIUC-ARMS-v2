<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Todos</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,100..700,0..1" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0f1e; --bg2: #111827; --bg3: #1a2236; --border: #2a3a5c;
    --text: #e8edf5; --text2: #94a3b8; --text3: #64748b; --green: #22c55e; --rose: #f43f5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 24px 18px 120px; max-width: 640px; margin: 0 auto;
  }
  .mi { font-family: 'Material Symbols Rounded'; font-size: 18px; line-height: 1; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; vertical-align: middle; }
  .mi.filled { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 20; }
  h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  h1 .dot.off { background: var(--text3); }
  .sub { font-size: 12px; color: var(--text2); margin-bottom: 20px; }
  .add { display: flex; gap: 8px; margin-bottom: 8px; }
  .add input[type=text] {
    flex: 1; min-width: 0; background: var(--bg2); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; font-size: 14px; outline: none;
    transition: border-color .15s;
  }
  .add input[type=text]:focus { border-color: var(--green); }
  .add input[type=number] {
    background: var(--bg2); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 10px; font-size: 13px; outline: none; width: 64px;
  }
  .add input[type=number]:focus { border-color: var(--green); }
  select, .btn {
    background: var(--bg2); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; font-size: 13px; cursor: pointer; outline: none;
    transition: border-color .15s, filter .15s;
  }
  select:focus { border-color: var(--green); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #06210f; font-weight: 700; }
  .btn:hover { filter: brightness(1.1); }
  .btn.icon { padding: 0; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; }
  .btn.icon:hover { border-color: var(--green); }
  input[type=text]:focus-visible, select:focus-visible, .btn:focus-visible { outline: 2px solid rgba(34,197,94,.45); outline-offset: 2px; }

  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .counter { font-size: 12px; color: var(--text2); }
  .counter b { color: var(--text); }
  .clear { background: none; border: none; color: var(--text3); font-size: 12px; cursor: pointer; padding: 4px 6px; border-radius: 8px; margin-top: 2px; }
  .clear:hover { color: var(--rose); background: rgba(244,63,94,.1); }
  .clear:disabled { opacity: .4; cursor: default; }
  .clear:disabled:hover { color: var(--text3); background: none; }

  .list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .todo {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px;
    transition: border-color .2s, box-shadow .2s;
  }
  .todo.running { border-color: rgba(34,197,94,.45); box-shadow: 0 0 0 1px rgba(34,197,94,.15); }
  .todo.done { opacity: .55; }
  .todo .check {
    width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--text3); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; color: #06210f;
    flex: none; transition: background .15s, transform .1s;
  }
  .check:active { transform: scale(.88); }
  .todo.done .check { background: var(--green); border-color: var(--green); }
  .todo .body { flex: 1; min-width: 0; }
  .todo .text { font-size: 14px; word-break: break-word; }
  .todo.done .text { text-decoration: line-through; color: var(--text3); }
  .todo .time { font-size: 12px; color: var(--text2); margin-top: 2px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .todo.running .time { color: var(--green); font-weight: 600; }
  .todo .act { display: flex; gap: 6px; flex: none; align-items: center; flex-wrap: wrap; }
  .todo .dur {
    background: var(--bg); color: var(--text2); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 5px; font-size: 11px; outline: none; cursor: pointer;
  }
  .todo .dur:focus, .todo .dur:hover { border-color: var(--green); }
  .todo .edit-input {
    background: var(--bg); color: var(--text); border: 1px solid var(--green);
    border-radius: 8px; padding: 6px 9px; font-size: 14px; width: 100%; outline: none;
  }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--bg2); border-radius: 12px; padding: 3px; }
  .tabs button { flex: 1; padding: 8px 12px; border: none; border-radius: 10px; background: transparent; color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tabs button.active { background: var(--bg); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .tabs .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; border-radius: 9px; background: var(--border); font-size: 10px; font-weight: 700; padding: 0 5px; }
  .tabs button.active .badge { background: var(--green); color: #06210f; }
  .foot { margin-top: 20px; text-align: center; font-size: 11px; color: var(--text3); }
  .foot a { color: var(--text2); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none;
    align-items: center; justify-content: center; padding: 18px; z-index: 50;
  }
  .overlay.show { display: flex; }
  .popup {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 20px;
    padding: 24px; width: 100%; max-width: 360px; text-align: center;
  }
  .popup .p-label { font-size: 13px; color: var(--text2); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
  .popup .p-title { font-size: 15px; font-weight: 700; margin-bottom: 18px; word-break: break-word; }
  .popup .p-time { font-size: 64px; font-weight: 800; letter-spacing: 3px; font-variant-numeric: tabular-nums; margin-bottom: 6px; }
  .popup .p-time.warn { color: var(--rose); }
  .popup .p-ctrl { display: flex; gap: 10px; justify-content: center; margin: 16px 0 12px; }
  .popup .p-ctrl .btn { padding: 12px 22px; font-size: 15px; }
  .popup .p-min { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }

  .capsule {
    position: fixed; right: 14px; bottom: 14px; left: auto; top: auto;
    display: none; align-items: center; gap: 9px; padding: 6px 13px 6px 8px;
    background: var(--bg3); border: 1px solid var(--border); border-radius: 999px;
    box-shadow: 0 10px 28px rgba(0,0,0,.55); z-index: 1600;
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
    transition: box-shadow .15s, border-color .15s, border-radius .15s, padding .15s;
    max-width: min(360px, calc(100vw - 24px));
  }
  .capsule.show { display: flex; }
  .capsule:hover { border-color: var(--text3); box-shadow: 0 14px 34px rgba(0,0,0,.65); }
  .capsule:focus-visible { outline: 2px solid rgba(34,197,94,.6); outline-offset: 2px; }
  .capsule.dragging { cursor: grabbing; transition: none; }
  .capsule .livedot { width: 9px; height: 9px; border-radius: 50%; background: var(--text3); flex: none; }
  .capsule.running .livedot { background: var(--green); animation: pulse 1.2s infinite; }
  .capsule.done .livedot { background: var(--text3); }
  .capsule .c-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; line-height: 1.15; }
  .capsule .c-label { font-size: 11.5px; font-weight: 600; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .capsule .c-row { display: flex; align-items: baseline; gap: 7px; }
  .capsule .c-time { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .5px; }
  .capsule.running .c-time { color: var(--green); }
  .capsule .c-state { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text3); }
  .capsule.running .c-state { color: var(--green); }
  .capsule .c-panel { display: none; flex: 1 0 100%; }
  .capsule.expanded { flex-wrap: wrap; border-radius: 18px; padding: 10px 12px; }
  .capsule.expanded .c-panel { display: block; margin-top: 6px; }
  .capsule.expanded .c-time { font-size: 24px; letter-spacing: 1px; }
  .capsule.expanded .cp-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .capsule.expanded .btn.icon { width: 36px; height: 36px; border-radius: 12px; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,.5); } 50% { box-shadow: 0 0 0 7px rgba(34,197,94,0); } }

  .empty { text-align: center; color: var(--text3); font-size: 13px; margin-top: 40px; }
  .empty .mi { font-size: 28px; display: block; margin-bottom: 8px; opacity: .5; }
  .note { margin-top: 14px; font-size: 11.5px; color: var(--text3); line-height: 1.5; }

  .deadline { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; padding: 2px 6px; border-radius: 6px; font-weight: 600; }
  .deadline.soon { background: rgba(245,158,11,.15); color: #f59e0b; }
  .deadline.overdue { background: rgba(244,63,94,.15); color: #f43f5e; }
  .deadline.ok { background: rgba(34,197,94,.1); color: #22c55e; }
  .deadline .mi { font-size: 12px; }
  .subnotes { width: 100%; padding-left: 32px; margin-top: 4px; }
  .subnote { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .subnote .sn-check { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--text3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; transition: background .15s, transform .1s; background: transparent; }
  .subnote .sn-check:active { transform: scale(.85); }
  .subnote.done .sn-check { background: var(--green); border-color: var(--green); }
  .subnote .sn-text { font-size: 12px; color: var(--text2); flex: 1; min-width: 0; word-break: break-word; }
  .subnote.done .sn-text { text-decoration: line-through; color: var(--text3); }
  .subnote .sn-del { background: none; border: none; color: var(--text3); font-size: 14px; cursor: pointer; padding: 0 2px; border-radius: 4px; opacity: 0; transition: opacity .15s, color .15s; display: inline-flex; align-items: center; line-height: 1; }
  .subnote:hover .sn-del { opacity: 1; }
  .subnote .sn-del:hover { color: var(--rose); }
  .subnote-add { display: flex; gap: 4px; margin-top: 4px; width: 100%; }
  .subnote-add input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font-size: 12px; outline: none; }
  .subnote-add input:focus { border-color: var(--green); }
  .subnote-add .btn { padding: 4px 8px; font-size: 11px; border-radius: 8px; }
  .add-note-btn { background: none; border: 1px dashed var(--border); color: var(--text3); font-size: 11px; padding: 2px 8px; border-radius: 6px; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 3px; margin-top: 4px; }
  .add-note-btn:hover { border-color: var(--green); color: var(--green); }
  .add-note-btn .mi { font-size: 13px; }
  .toggle-dl { background: none; border: 1px solid var(--border); color: var(--text3); font-size: 11px; padding: 4px 6px; border-radius: 8px; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 3px; }
  .toggle-dl:hover { border-color: var(--green); color: var(--green); }
  .toggle-dl .mi { font-size: 13px; }

  @media (max-width: 420px) {
    body { padding: 16px 12px 100px; }
    .add { flex-wrap: wrap; }
    .add input[type=text] { flex: 1 1 100%; min-width: 0; }
    .add select, .add input[type=number], .add .btn.primary { flex: 1; min-width: 0; }
    .todo .body { flex: 1 1 100%; min-width: 0; order: 1; }
    .todo .check { order: 0; }
    .todo .act { flex: 1 1 100%; order: 2; width: 100%; justify-content: flex-end; padding-top: 6px; border-top: 1px solid var(--border); margin-top: 2px; }
    .todo .act .btn.icon { width: 34px; height: 34px; }
    .todo .act .dur { min-width: 0; }
    .subnotes { padding-left: 0; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1><span class="dot" id="hdot"></span>Focus Tasks</h1>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="active" data-tab="active"><span class="mi">radio_button_unchecked</span> Active <span class="badge" id="activeCount">0</span></button>
    <button data-tab="done"><span class="mi filled">check_circle</span> Done <span class="badge" id="doneCount">0</span></button>
  </div>

  <div class="add">
    <input id="newText" type="text" placeholder="What are you focusing on?" maxlength="120" />
    <select id="newDur">
      <option value="0">No timer</option>
      <option value="300">5 min</option>
      <option value="900">15 min</option>
      <option value="1500" selected>25 min</option>
      <option value="2700">45 min</option>
      <option value="3600">1 hr</option>
      <option value="custom">Custom...</option>
    </select>
    <input id="newDurCustom" type="number" min="1" max="1440" step="1" placeholder="min" title="Minutes" style="display:none" />
    <button class="btn icon toggle-dl" id="newDlBtn" title="Set deadline"><span class="mi">calendar_today</span></button>
    <input id="newDeadline" type="datetime-local" style="display:none" />
    <button class="btn primary" id="addBtn"><span class="mi">add</span></button>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty"><span class="mi">checklist</span>No tasks yet. Add one above.</div>

  <div class="overlay" id="overlay">
    <div class="popup">
      <div class="p-label" id="pLabel">Timer</div>
      <div class="p-title" id="pTitle"></div>
      <div class="p-time" id="pTime">25:00</div>
      <div class="p-ctrl">
        <button class="btn primary" id="pStart"><span class="mi" id="pStartIco">play_arrow</span> Start</button>
        <button class="btn" id="pReset"><span class="mi">restart_alt</span> Reset</button>
      </div>
      <div class="p-min">
        <button class="btn" id="pMin"><span class="mi">minimize</span> Minimize</button>
        <button class="btn" id="pFloat"><span class="mi">picture_in_picture</span> Float</button>
      </div>
      <div class="note" style="margin-top:10px" id="pipNote"></div>
    </div>
  </div>

  <div class="capsule" id="capsule" role="button" tabindex="0" aria-expanded="false" aria-label="Timer">
    <span class="livedot" id="cDot"></span>
    <div class="c-text">
      <div class="c-label" id="cLabel"></div>
      <div class="c-row">
        <span class="c-time" id="cTime">25:00</span>
        <span class="c-state" id="cState">Paused</span>
      </div>
    </div>
    <div class="c-panel">
      <div class="cp-btns">
        <button class="btn icon" id="cPlay" title="Start / Pause"><span class="mi" id="cPlayIco">play_arrow</span></button>
        <button class="btn icon" id="cMin5" title="Add 5 minutes"><span class="mi">add</span></button>
        <button class="btn icon" id="cStop" title="Complete task"><span class="mi filled">check_circle</span></button>
        <button class="btn icon" id="cFloat" title="Float on top"><span class="mi">picture_in_picture</span></button>
        <button class="btn icon" id="cClose" title="Close bubble"><span class="mi">close</span></button>
      </div>
    </div>
  </div>

<script>
  const STORE_KEY = 'qsis_todos_v1';
  const $ = (id) => document.getElementById(id);
  const inIframe = window.self !== window.top;
  const fmt = (s) => {
    s = Math.max(0, Math.ceil(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
    return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  };

  if (inIframe) {
    const cap = $('capsule');
    if (cap) cap.style.display = 'none';
  }

  let todos = loadTodos();
  let activeId = null;
  let capsuleId = null;
  let pipWindow = null;
  let popWindow = null;
  let popupId = null;
  let editingId = null;
  let tabView = 'active';
  let addingNoteId = null;

  const running = () => todos.find((t) => t.running);

  function loadTodos() {
    try {
      const data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      const list = Array.isArray(data && data.todos) ? data.todos : [];
      return list.map((t) => ({
        id: String(t.id || Math.random().toString(36).slice(2, 10)),
        text: String(t.text || ''),
        duration: t.duration === 0 ? 0 : Math.max(5, Number(t.duration) || 1500),
        remaining: t.duration === 0 ? 0 : Math.max(0, t.remaining !== undefined && t.remaining !== null ? Number(t.remaining) : (Number(t.duration) || 1500)),
        running: !!t.running,
        done: !!t.done,
        lastTick: Number(t.lastTick) || 0,
        createdAt: Number(t.createdAt) || Date.now(),
        notes: Array.isArray(t.notes) ? t.notes.map(n => ({
          id: String(n.id || Math.random().toString(36).slice(2, 8)),
          text: String(n.text || ''),
          done: !!n.done,
        })) : [],
        deadline: t.deadline || null,
      }));
    } catch { return []; }
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify({ todos })); }

  (function reconcile() {
    const t = todos.find((x) => x.running);
    if (t && t.lastTick) {
      t.remaining = Math.max(0, t.remaining - Math.floor((Date.now() - t.lastTick) / 1000));
      if (t.remaining <= 0) { t.remaining = 0; t.running = false; t.lastTick = 0; t.done = true; }
    }
    activeId = t && t.running ? t.id : null;
    save();
  })();

  function beep() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      [0, .18, .36, .54].forEach((dt) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880;
        o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(.001, ctx.currentTime + dt);
        g.gain.exponentialRampToValueAtTime(.4, ctx.currentTime + dt + .02);
        g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dt + .35);
        o.start(ctx.currentTime + dt); o.stop(ctx.currentTime + dt + .4);
      });
    } catch {}
  }

  function find(id) { return todos.find((t) => t.id === id); }

  function complete(t) {
    t.running = false; t.lastTick = 0; t.done = true;
    if (activeId === t.id) activeId = null;
    beep(); save(); render();
  }

  function startTodo(id) {
    const t = find(id); if (!t) return;
    if (t.duration === 0) return;
    const other = todos.find((x) => x.running && x.id !== id);
    if (other) { other.running = false; other.lastTick = 0; }
    t.done = false;
    if (t.remaining <= 0) t.remaining = t.duration;
    t.running = true; t.lastTick = Date.now();
    activeId = id;
    if (capDismissed === id) capDismissed = null;
    save(); render();
  }
  function pauseTodo(id) {
    const t = find(id); if (!t) return;
    if (t.running) t.remaining = Math.max(0, t.remaining - Math.floor((Date.now() - t.lastTick) / 1000));
    t.running = false; t.lastTick = 0;
    if (activeId === id) activeId = null;
    save(); render();
  }
  function resetTodo(id) {
    const t = find(id); if (!t) return;
    t.remaining = t.duration; t.running = false; t.lastTick = 0; t.done = false;
    if (activeId === id) activeId = null;
    save(); render();
  }
  function toggleDone(id) {
    const t = find(id); if (!t) return;
    t.done = !t.done;
    if (t.done) pauseTodo(id);
    save(); render();
  }
  function deleteTodo(id) {
    todos = todos.filter((t) => t.id !== id);
    if (activeId === id) activeId = null;
    if (capsuleId === id) { capsuleId = null; closeFloat(); }
    if (popupId === id) closePopup();
    save(); render();
  }
  function addTodo() {
    const text = $('newText').value.trim();
    if (!text) return;
    const durSel = $('newDur');
    let secs = Number(durSel.value);
    if (durSel.value === 'custom') {
      secs = Math.round(Number($('newDurCustom').value) * 60);
      if (!(secs >= 60 && secs <= 86400)) { $('newDurCustom').focus(); return; }
    }
    const deadlineVal = $('newDeadline').value || null;
    todos.unshift({
      id: Math.random().toString(36).slice(2, 10),
      text, duration: secs, remaining: secs,
      running: false, done: false, lastTick: 0, createdAt: Date.now(),
      notes: [],
      deadline: deadlineVal ? new Date(deadlineVal).toISOString() : null,
    });
    $('newText').value = '';
    $('newDurCustom').value = '';
    $('newDurCustom').style.display = 'none';
    $('newDeadline').value = '';
    $('newDeadline').style.display = 'none';
    save(); render();
  }
  function setDuration(id, d) {
    const t = find(id); if (!t) return;
    t.duration = d;
    if (!t.running) t.remaining = d;
    save(); render();
  }
  function clearDone() {

  function deadlineClass(dl) {

    if (diff < 3600000) return Math.ceil(diff / 60000) + 'm left';

  // ── Popup ────────────────────────────────────────────────────────────────

  // ── Floating timer bubble ────────────────────────────────────────────────
  const CAP_POS_KEY = 'qsis_todos_capsule_pos';
  const CAP_DRAG_THRESHOLD = 6;

  let capPos = null;

  function loadCapPos() {
    try {
      const p = JSON.parse(localStorage.getItem(CAP_POS_KEY) || 'null');
      if (p && Number.isFinite(p.x) && Number.isFinite(p.y)) capPos = { x: p.x, y: p.y };

      'button{background:#1a2236;color:#e8edf5;border:1px solid #2a3a5c;border-radius:10px;width:38px;height:38px;font-size:14px;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center}' +

  function closePip() { if (pipWindow) { try { pipWindow.close(); } catch {} pipWindow = null; } updateCapsule(); }

  function syncPip() {

  // ── Render ───────────────────────────────────────────────────────────────
  function render() {
    $('hdot').classList.toggle('off', !activeId);
    const list = $('list');
    list.innerHTML = '';
    const active = todos.filter((t) => !t.done);
    const done = todos.filter((t) => t.done);

      const row = document.createElement('div');
      row.className = 'todo' + (t.running ? ' running' : '') + (t.done ? ' done' : '');
      const isNote = t.duration === 0;

      let timeHtml = '';
      if (isNote) {
        timeHtml = '<span>Note</span>';
      } else {
        timeHtml = '<span>' + fmt(t.remaining) + ' &middot; ' +
          (t.duration >= 3600 ? (t.duration / 3600) + ' hr' : t.duration / 60 + ' min') + '</span>';
      }

      if (t.deadline) {
        const dlCls = deadlineClass(t.deadline);
        const dlTxt = deadlineText(t.deadline);
        timeHtml += '<span class="deadline ' + dlCls + '"><span class="mi">schedule</span> ' + dlTxt + '</span>';
      }

      row.innerHTML =
        '<span class="check">' + (t.done ? '<span class="mi" style="font-size:14px;color:#06210f">check</span>' : '') + '</span>' +
        '<div class="body"><div class="text"></div><div class="time">' + timeHtml + '</div></div>' +
        '<div class="act">' +
          (isNote ? '' : '<button class="btn icon" data-act="popup" title="Open timer popup"><span class="mi">timer</span></button>') +
          (isNote ? '' : '<button class="btn icon" data-act="play" title="Start / Pause"><span class="mi">' + (t.running ? 'pause' : 'play_arrow') + '</span></button>') +
          '<button class="btn icon toggle-dl" data-act="deadline" title="Set deadline"><span class="mi">calendar_today</span></button>' +
          '<select class="dur" data-act="dur" title="Duration">' + durationOptions(t.duration) + '</select>' +
          '<button class="btn icon" data-act="edit" title="Edit text"><span class="mi">edit</span></button>' +
          (isNote ? '' : '<button class="btn icon" data-act="reset" title="Reset"><span class="mi">restart_alt</span></button>') +

      row.querySelector('[data-act="edit"]').addEventListener('click', () => editTodo(t.id));

      const resetBtn = row.querySelector('[data-act="reset"]');
      if (resetBtn) resetBtn.addEventListener('click', () => resetTodo(t.id));

      row.querySelector('[data-act="del"]').addEventListener('click', () => deleteTodo(t.id));

      if (t.notes.length > 0 || addingNoteId === t.id) {
        const subDiv = document.createElement('div');
        subDiv.className = 'subnotes';
        for (const n of t.notes) {
          const sn = document.createElement('div');
          sn.className = 'subnote' + (n.done ? ' done' : '');
          sn.innerHTML =
            '<div class="sn-check">' + (n.done ? '<span class="mi" style="font-size:10px;color:#06210f">check</span>' : '') + '</div>' +
            '<span class="sn-text"></span>' +
            '<button class="sn-del"><span class="mi" style="font-size:14px">close</span></button>';

        }

        if (addingNoteId === t.id) {
          const addForm = document.createElement('div');
          addForm.className = 'subnote-add';
          addForm.innerHTML = '<input type="text" placeholder="Add a note..." maxlength="120" /><button class="btn primary">Add</button>';
          const snInp = addForm.querySelector('input');
          const snBtn = addForm.querySelector('button');
          snBtn.addEventListener('click', () => {
            if (snInp.value.trim()) { addSubNote(t.id, snInp.value); addingNoteId = null; }
          });
          snInp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && snInp.value.trim()) { addSubNote(t.id, snInp.value); addingNoteId = null; }
            if (e.key === 'Escape') { addingNoteId = null; render(); }
          });
          subDiv.appendChild(addForm);
          setTimeout(() => { snInp.focus(); }, 10);
        } else {
          const addBtn = document.createElement('button');
          addBtn.className = 'add-note-btn';
          addBtn.innerHTML = '<span class="mi">add</span> Note';
          addBtn.addEventListener('click', () => { addingNoteId = t.id; render(); });
          subDiv.appendChild(addBtn);
        }

        row.querySelector('.body').appendChild(subDiv);
      } else {
        const addBtnWrap = document.createElement('div');
        addBtnWrap.style.cssText = 'width:100%;padding-left:32px;';
        const addBtn = document.createElement('button');
        addBtn.className = 'add-note-btn';
        addBtn.innerHTML = '<span class="mi">add</span> Note';
        addBtn.addEventListener('click', () => { addingNoteId = t.id; render(); });
        addBtnWrap.appendChild(addBtn);
        row.querySelector('.body').appendChild(addBtnWrap);
      }

      list.appendChild(row);
    }
    if (!capsuleId && activeId && activeId !== capDismissed) capsuleId = activeId;
    updateCapsule();
    updatePopup();
  }

  function tick() {
    if (popWindow && (popWindow.closed || !localStorage.getItem(FLOAT_ID_KEY))) {
      popWindow = null;
      updateCapsule();
    }
    const t = running();
    if (t) {
      const now = Date.now();
      const elapsed = Math.floor((now - t.lastTick) / 1000);
      if (elapsed > 0) {
        t.remaining = Math.max(0, t.remaining - elapsed);
        t.lastTick = now;
        if (t.remaining <= 0) { complete(t); return; }
      }
    }
    if (!document.hidden) renderTimesOnly();
    updateCapsule();
    syncPip();
    updatePopup();
  }
  function renderTimesOnly() {
    document.querySelectorAll('.todo').forEach((row, i) => {
      const t = todos[i];
      const el = row.querySelector('.time');
      if (!t || !el || t.duration === 0) return;
      let timeHtml = '<span>' + fmt(t.remaining) + ' &middot; ' +
        (t.duration >= 3600 ? (t.duration / 3600) + ' hr' : t.duration / 60 + ' min') + '</span>';
      if (t.deadline) {
        const dlCls = deadlineClass(t.deadline);
        const dlTxt = deadlineText(t.deadline);
        timeHtml += '<span class="deadline ' + dlCls + '"><span class="mi">schedule</span> ' + dlTxt + '</span>';
      }
      el.innerHTML = timeHtml;
    });
    $('pTime').textContent = popupId && find(popupId) ? fmt(find(popupId).remaining) : $('pTime').textContent;
    $('pTime').classList.toggle('warn', !!running() && running().remaining <= 60 && running().remaining > 0);
  }
  setInterval(tick, 300);

  // ── Events ───────────────────────────────────────────────────────────────
  $('addBtn').addEventListener('click', addTodo);
  $('newText').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTodo(); });
  $('newDur').addEventListener('change', () => {
    const v = $('newDur').value;
    const on = v === 'custom';
    $('newDurCustom').style.display = on ? '' : 'none';
    if (on) $('newDurCustom').focus();
  });
  $('newDlBtn').addEventListener('click', () => {
    const dl = $('newDeadline');
    if (dl.style.display === 'none') {
      dl.style.display = '';
      dl.focus();
      if (dl.showPicker) { try { dl.showPicker(); } catch {} }
    } else {
      dl.style.display = 'none';
      dl.value = '';
    }
  });
  document.querySelectorAll('#tabs button').forEach((btn) => {
    btn.addEventListener('click', () => setTab(btn.dataset.tab));
  });
  $('pStart').addEventListener('click', () => { const t = find(popupId); if (t) t.running ? pauseTodo(t.id) : startTodo(t.id); });
  $('pReset').addEventListener('click', () => { if (popupId) resetTodo(popupId); });
  $('pMin').addEventListener('click', () => closePopup());
  $('pFloat').addEventListener('click', () => { if (popupId) { capsuleId = popupId; } void floatTop(); });
  $('overlay').addEventListener('click', (e) => { if (e.target === $('overlay')) closePopup(); });
  $('cPlay').addEventListener('click', () => { const t = find(capsuleId); if (t) t.running ? pauseTodo(t.id) : startTodo(t.id); });
  $('cMin5').addEventListener('click', () => {
    const t = find(capsuleId); if (!t) return;
    t.remaining = Math.max(0, t.remaining + 300);
    t.done = false;
    save(); render();
  });
  $('cStop').addEventListener('click', () => { const t = find(capsuleId); if (t) complete(t); });
  $('cFloat').addEventListener('click', () => void floatTop());
  $('cClose').addEventListener('click', () => {
    capDismissed = capsuleId;
    capsuleId = null;
    closeFloat();
    setCapExpanded(false);
    updateCapsule();
  });

  window.addEventListener('storage', (e) => {
    if (e.key === STORE_KEY) {
      todos = loadTodos();
      activeId = todos.find((x) => x.running) ? todos.find((x) => x.running).id : null;
      if (capsuleId && !find(capsuleId)) capsuleId = null;
      save(); render();
    } else if (e.key === FLOAT_CMD_KEY && e.newValue) {
      try {
        const cmd = JSON.parse(e.newValue);
        const id = cmd && cmd.id;
        if (!id) return;
        if (cmd.cmd === 'play') { const t = find(id); if (t) t.running ? pauseTodo(t.id) : startTodo(t.id); }
        else if (cmd.cmd === 'reset') resetTodo(id);
        else if (cmd.cmd === '+5') {
          const t = find(id);
          if (t) { t.remaining = Math.max(0, t.remaining + 300); t.done = false; save(); render(); }
        } else if (cmd.cmd === 'close') { if (capsuleId === id || find(id)) { capsuleId = id || capsuleId; closeFloat(); } }
      } catch {}
    }
  });

  $('capsule').addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    capDragging = true;
    capMoved = false;
    capDragStart = { x: e.clientX, y: e.clientY };
    const r = $('capsule').getBoundingClientRect();
    capDragBase = { left: r.left, top: r.top };
    try { $('capsule').setPointerCapture(e.pointerId); } catch {}
  });
  $('capsule').addEventListener('pointermove', (e) => {
    if (!capDragging) return;
    const dx = e.clientX - capDragStart.x;
    const dy = e.clientY - capDragStart.y;
    if (!capMoved && Math.hypot(dx, dy) < CAP_DRAG_THRESHOLD) return;
    capMoved = true;
    $('capsule').classList.add('dragging');
    if (!capPos) capPos = { x: capDragBase.left, y: capDragBase.top };
    capPos.x = capDragBase.left + dx;
    capPos.y = capDragBase.top + dy;
    clampCap();
    $('capsule').style.left = capPos.x + 'px';
    $('capsule').style.top = capPos.y + 'px';
    $('capsule').style.right = 'auto';
    $('capsule').style.bottom = 'auto';
  });
  $('capsule').addEventListener('pointerup', () => {
    if (!capDragging) return;
    capDragging = false;
    $('capsule').classList.remove('dragging');
    if (capMoved) saveCapPos();
    else toggleCapExpanded();
  });
  $('capsule').addEventListener('pointercancel', () => {
    capDragging = false;
    $('capsule').classList.remove('dragging');
  });
  $('capsule').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggleCapExpanded();
    } else if (e.key === 'Escape') {
      setCapExpanded(false);
      $('capsule').focus();
    }
  });
  document.addEventListener('pointerdown', (e) => {
    if (capExpanded && !$('capsule').contains(e.target)) setCapExpanded(false);
  });
  window.addEventListener('resize', () => { if (capPos) { clampCap(); applyCapPos(); } });

  render();
</script>
</body>
</html>
