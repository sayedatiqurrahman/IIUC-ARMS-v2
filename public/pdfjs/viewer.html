<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PDF Viewer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --toolbar-bg: #1e1e1e;
  --toolbar-border: #333;
  --toolbar-height: 42px;
  --page-bg: #525659;
  --btn-hover: #3a3a3a;
  --btn-active: #505050;
  --text: #e0e0e0;
  --text-light: #999;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--page-bg);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* ── Toolbar ── */
#toolbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--toolbar-height);
  background: var(--toolbar-bg);
  border-bottom: 1px solid var(--toolbar-border);
  display: flex; align-items: center;
  padding: 0 8px;
  z-index: 100;
  gap: 2px;
  user-select: none;
}

.tb-sep {
  width: 1px; height: 20px;
  background: #444; margin: 0 4px;
}

.tb-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 30px; height: 30px; padding: 0 6px;
  background: none; border: none; border-radius: 4px;
  cursor: pointer; color: var(--text);
  font-size: 13px; font-family: inherit;
  transition: background 0.1s;
}
.tb-btn:hover { background: var(--btn-hover); }
.tb-btn:active { background: var(--btn-active); }
.tb-btn.active { background: #4285f4; color: #fff; }
.tb-btn svg { width: 16px; height: 16px; fill: currentColor; }

#pageInput {
  width: 44px; height: 24px;
  text-align: center; font-size: 12px;
  border: 1px solid #555; border-radius: 3px;
  background: #2d2d2d; color: var(--text);
  outline: none;
}
#pageInput:focus { border-color: #4285f4; }

#pageTotal { font-size: 12px; color: var(--text-light); margin: 0 2px; }

#scaleSelect {
  height: 24px; font-size: 12px;
  border: 1px solid #555; border-radius: 3px;
  background: #2d2d2d; color: var(--text);
  outline: none; cursor: pointer;
}

#titleText {
  flex: 1; text-align: center;
  font-size: 12px; color: var(--text-light);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 0 8px;
}

/* Close button */
#closeBtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; padding: 0;
  background: none; border: none; border-radius: 4px;
  cursor: pointer; color: #f44336;
  font-size: 16px; transition: background 0.1s;
}
#closeBtn:hover { background: rgba(244,67,54,0.15); }
#closeBtn svg { width: 18px; height: 18px; fill: currentColor; }

/* ── Viewer area ── */
#viewerContainer {
  position: fixed;
  top: var(--toolbar-height); left: 0; right: 0; bottom: 0;
  overflow: auto;
  background: var(--page-bg);
}

#viewer {
  display: flex; flex-direction: column;
  align-items: center;
  padding: 10px 0;
  gap: 8px;
}

.page {
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  position: relative;
  line-height: 0;
}

.page canvas { display: block; }

/* ── Annotation layer ── */
.annotationLayer {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden;
  opacity: 1;
}

.annotationLayer section {
  position: absolute;
  text-align: initial;
}

.annotationLayer section a { text-decoration: none; }

.annotationLayer section .popup {
  position: absolute;
  background: #fff;
  border: 1px solid rgba(0,0,0,0.2);
  border-radius: 4px;
  padding: 8px 12px;
  font-size: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  max-width: 250px;
  z-index: 10;
}

.annotationLayer section .popup .popupContent { color: #333; }

.annotationLayer section.markupAnnotation {
  border: 2px solid #f44336;
  border-radius: 2px;
}

.annotationLayer section.linkAnnotation > a,
.annotationLayer section.emptyAnnotation > a {
  display: block;
  position: absolute;
  width: 100%; height: 100%;
  cursor: pointer;
}

.annotationLayer .linkAnnotation > a:hover { background: rgba(66,133,244,0.15); }

/* Ink, line, circle, etc */
.annotationLayer section.svgAnnotation svg {
  width: 100%; height: 100%;
}

/* ── Text layer ── */
.textLayer {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden; opacity: 0.25;
  line-height: 1;
}

.textLayer span,
.textLayer br {
  color: transparent;
  position: absolute;
  white-space: pre;
  transform-origin: 0% 0%;
}

.textLayer ::selection { background: rgba(0,100,200,0.3); }

/* ── Loading ── */
#loadingOverlay {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--page-bg); z-index: 200;
  flex-direction: column; gap: 12px;
}
#loadingOverlay.hidden { display: none; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loadingText { color: #999; font-size: 13px; }

/* Hand tool cursor */
#viewerContainer.grab { cursor: grab; }
#viewerContainer.grab:active { cursor: grabbing; }
#viewerContainer.textSelect { cursor: auto; }

/* Scrollbar */
#viewerContainer::-webkit-scrollbar { width: 10px; }
#viewerContainer::-webkit-scrollbar-track { background: var(--page-bg); }
#viewerContainer::-webkit-scrollbar-thumb { background: #666; border-radius: 5px; border: 2px solid var(--page-bg); }
#viewerContainer::-webkit-scrollbar-thumb:hover { background: #888; }

/* Print */
@media print {
  #toolbar { display: none !important; }
  #viewerContainer { top: 0 !important; }
  .page { box-shadow: none !important; margin: 0 !important; break-after: page; }
}
</style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <button class="tb-btn" id="prevBtn" title="Previous Page">
    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
  </button>
  <input id="pageInput" type="number" min="1" value="1">
  <span id="pageTotal">/ 1</span>
  <button class="tb-btn" id="nextBtn" title="Next Page">
    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
  </button>

  <div class="tb-sep"></div>

  <button class="tb-btn" id="zoomOutBtn" title="Zoom Out (-)">
    <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
  </button>
  <select id="scaleSelect">
    <option value="auto" selected>Auto</option>
    <option value="0.5">50%</option>
    <option value="0.75">75%</option>
    <option value="1">100%</option>
    <option value="1.25">125%</option>
    <option value="1.5">150%</option>
    <option value="2">200%</option>
  </select>
  <button class="tb-btn" id="zoomInBtn" title="Zoom In (+)">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>

  <div class="tb-sep"></div>

  <button class="tb-btn" id="fitWidthBtn" title="Fit to Width">
    <svg viewBox="0 0 24 24"><path d="M3 5v14h18V5H3zm4 12H5V7h2v10zm4 0H9V7h2v10zm4 0h-2V7h2v10zm4 0h-2V7h2v10z"/></svg>
  </button>
  <button class="tb-btn" id="fitPageBtn" title="Fit to Page">
    <svg viewBox="0 0 24 24"><path d="M19 19H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
  </button>
  <button class="tb-btn" id="rotateBtn" title="Rotate">
    <svg viewBox="0 0 24 24"><path d="M7.11 8.53L5.7 7.11C4.8 8.27 4.24 9.61 4.07 11h2.02c.14-.87.49-1.72 1.02-2.47zM6.09 13H4.07c.17 1.39.72 2.73 1.62 3.89l1.41-1.42c-.52-.75-.87-1.59-1.01-2.47zM7.1 18.32c1.16.9 2.51 1.44 3.9 1.61V17.9c-.87-.15-1.71-.49-2.46-1.03L7.1 18.32zM13 4.07V1L8.45 5.55 13 10V6.09c2.84.48 5 2.94 5 5.91s-2.16 5.43-5 5.91v2.02c3.95-.49 7-3.85 7-7.93s-3.05-7.44-7-7.93z"/></svg>
  </button>

  <div class="tb-sep"></div>

  <button class="tb-btn" id="handToolBtn" title="Hand Tool (H)">
    <svg viewBox="0 0 24 24"><path d="M18 24c-1.1 0-2-.9-2-2V8.88c0-.56-.23-1.1-.63-1.48L11.82 2.6c-.39-.38-.9-.6-1.44-.6s-1.05.22-1.44.6L4.72 6.82c-.78.78-.78 2.05 0 2.83l2.34 2.34c.39.39.63.93.63 1.49V22c0 1.1-.9 2-2 2s-2-.9-2-2v-8.52c0-1.08-.44-2.1-1.22-2.83L.59 8.31C-.2 7.52-.2 6.25.59 5.47l5.43-5.44c.78-.78 2.05-.78 2.83 0l4.12 4.12c.39.38.63.92.63 1.48V22c0 1.1.9 2 2 2s2-.9 2-2V8.88c0-.56.23-1.1.63-1.48l1.41-1.41c.78-.78 2.05-.78 2.83 0 .78.78.78 2.05 0 2.83l-1.41 1.41c-.39.38-.63.92-.63 1.48V22c0 1.1-.9 2-2 2z"/></svg>
  </button>

  <span id="titleText"></span>

  <button class="tb-btn" id="printBtn" title="Print">
    <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
  </button>
  <button class="tb-btn" id="downloadBtn" title="Download">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
  </button>

  <div class="tb-sep"></div>

  <button class="tb-btn" id="fullscreenBtn" title="Fullscreen (F)">
    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
  </button>

  <button id="closeBtn" title="Close (Esc)">
    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>
</div>

<!-- Viewer -->
<div id="viewerContainer">
  <div id="viewer"></div>
</div>

<!-- Loading -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">Loading PDF...</div>
</div>

<script type="module">
import * as pdfjsLib from './pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';

const { AnnotationLayerBuilder, TextLayerBuilder } = await import('./pdf_viewer.mjs');
const NullL10n = { getDirectionality: () => 'ltr', get: (id, def) => Promise.resolve(def), translate: (el) => Promise.resolve(el) };

const params = new URLSearchParams(window.location.search);
const hashParams = new URLSearchParams(window.location.hash.slice(1));
const fileUrl = params.get('file');
const filePath = params.get('path') || '';
const initialPage = parseInt(hashParams.get('page')) || 1;

let pdfDoc = null, currentPage = 1, totalPages = 0;
let currentScale = 1, rotation = 0;
let lastSavedPage = 0, saveTimer = null;
let handTool = false;
let observer = null;
const PAGE_KEY = filePath ? 'pdf-page-' + filePath : '';
const pageViews = new Map(); // i -> { page, div, canvas, rendered, task }

const $ = (id) => document.getElementById(id);

/* ── Lazy page rendering ──────────────────────────────────────────── */

function renderTextLayer(pv, vp) {
  try {
    const old = pv.div.querySelector('.textLayer');
    if (old) old.remove();
    const layer = document.createElement('div');
    layer.className = 'textLayer';
    layer.style.width = vp.width + 'px';
    layer.style.height = vp.height + 'px';
    pv.div.appendChild(layer);
    const builder = new TextLayerBuilder({ pdfPage: pv.page, enablePermissions: true });
    layer.appendChild(builder.div);
    builder.render({ viewport: vp });
  } catch {}
}

function renderAnnotations(pv, vp, i) {
  try {
    const old = pv.div.querySelector('.annotationLayer');
    if (old) old.remove();
    const layer = document.createElement('div');
    layer.className = 'annotationLayer';
    layer.style.width = vp.width + 'px';
    layer.style.height = vp.height + 'px';
    pv.div.appendChild(layer);
    pv.page.getAnnotations().then((annotations) => {
      if (!annotations.length) return;
      const builder = new AnnotationLayerBuilder({
        pageDiv: pv.div,
        pdfPage: pv.page,
        annotationStorage: pdfDoc.annotationStorage,
        linkService: {
          pdfDocument: pdfDoc,
          pagesCount: totalPages,
          page: i,
          currentPageNumber: i,
          setPage: (n) => goToPage(n),
          destinationName: null,
          setDestinationName: (name) => {},
          setHash: (hash) => {},
        },
        l10n: NullL10n,
      });
      builder.render(vp, undefined);
    });
  } catch {}
}

function clearPage(i) {
  const pv = pageViews.get(i);
  if (!pv) return;
  if (pv.task) {
    try { pv.task.cancel(); } catch {}
    pv.task = null;
  }
  if (pv.canvas) {
    const ctx = pv.canvas.getContext('2d');
    ctx.clearRect(0, 0, pv.canvas.width, pv.canvas.height);
  }
  const tl = pv.div && pv.div.querySelector('.textLayer');
  if (tl) tl.remove();
  const al = pv.div && pv.div.querySelector('.annotationLayer');
  if (al) al.remove();
  pv.rendered = false;
}

async function renderPage(i) {
  const pv = pageViews.get(i);
  if (!pv || pv.rendered || pv.task) return;
  try {
    const page = pv.page;
    const vp = page.getViewport({ scale: currentScale, rotation });
    const dpr = window.devicePixelRatio || 1;
    pv.canvas.width = Math.max(1, Math.floor(vp.width * dpr));
    pv.canvas.height = Math.max(1, Math.floor(vp.height * dpr));
    pv.canvas.style.width = vp.width + 'px';
    pv.canvas.style.height = vp.height + 'px';
    pv.div.style.width = vp.width + 'px';
    pv.div.style.height = vp.height + 'px';
    const ctx = pv.canvas.getContext('2d');
    const task = page.render({
      canvasContext: ctx,
      viewport: vp,
      transform: [dpr, 0, 0, dpr, 0, 0],
    });
    pv.task = task;
    try {
      await task.promise;
    } catch (e) {
      if (e && e.name !== 'RenderingCancelledException') throw e;
      return;
    }
    pv.task = null;
    if (!pv.div.isConnected) return;
    pv.rendered = true;
    renderTextLayer(pv, vp);
    renderAnnotations(pv, vp, i);
  } catch (e) {
    pv.task = null;
  }
}

function isNearViewport(div) {
  const c = $('viewerContainer').getBoundingClientRect();
  const r = div.getBoundingClientRect();
  return r.bottom > c.top - c.height && r.top < c.bottom + c.height;
}

function renderVisible() {
  for (const [i, pv] of pageViews) {
    if (pv.rendered || pv.task) continue;
    if (isNearViewport(pv.div)) renderPage(i);
  }
}

/* ── Build page placeholders (cheap: no rendering) ────────────────── */

async function buildPages() {
  const viewer = $('viewer');
  viewer.innerHTML = '';
  pageViews.clear();
  const container = $('viewerContainer');

  for (let i = 1; i <= totalPages; i++) {
    const page = await pdfDoc.getPage(i);
    const vp = page.getViewport({ scale: 1, rotation });
    const div = document.createElement('div');
    div.className = 'page';
    div.id = 'page-' + i;
    div.dataset.page = i;
    const canvas = document.createElement('canvas');
    div.appendChild(canvas);
    viewer.appendChild(div);
    pageViews.set(i, { page, div, canvas, rendered: false, task: null });
    observer.observe(div);
  }

  // Size all placeholders up-front so IntersectionObserver sees real geometry.
  const first = pageViews.get(1);
  if (first) {
    const avail = container.clientWidth - 40;
    currentScale = Math.max(0.25, Math.min(3, avail / first.page.getViewport({ scale: 1, rotation }).width));
  }
  for (const [i, pv] of pageViews) {
    const vp = pv.page.getViewport({ scale: currentScale, rotation });
    pv.div.style.width = vp.width + 'px';
    pv.div.style.height = vp.height + 'px';
  }
}

/* ── Load PDF ── */
async function loadPdf(url) {
  try {
    pdfDoc = await pdfjsLib.getDocument({ url, corsOrigin: 'anonymous', cMapUrl: './cmaps/', cMapPacked: true }).promise;
    totalPages = pdfDoc.numPages;
    $('pageTotal').textContent = '/ ' + totalPages;
    $('pageInput').max = totalPages;
    const fname = decodeURIComponent(url.split('/').pop().replace(/\.pdf$/i, '')) || 'PDF';
    document.title = fname;
    $('titleText').textContent = fname;
    await buildPages();
    $('loadingOverlay').classList.add('hidden');
    requestAnimationFrame(() => {
      goToPage(initialPage);
      renderVisible();
    });
  } catch (e) {
    $('loadingOverlay').innerHTML =
      '<div style="color:#f87171;font-size:14px;text-align:center;padding:20px">Failed to load PDF.<br>' + e.message + '</div>';
  }
}

/* ── Scale helpers ── */
async function refitPages() {
  // Re-render already-rendered pages at the new scale, then fill in visible ones.
  const tasks = [];
  for (const [i, pv] of pageViews) {
    if (pv.rendered) {
      clearPage(i);
      tasks.push(renderPage(i));
    }
  }
  await Promise.all(tasks);
  renderVisible();
}

async function fitToWidth() {
  if (!pdfDoc) return;
  const container = $('viewerContainer');
  const w = container.clientWidth - 40;
  const vp = pageViews.get(1).page.getViewport({ scale: 1, rotation });
  currentScale = Math.max(0.25, Math.min(3, w / vp.width));
  $('scaleSelect').value = 'auto';
  await refitPages();
  goToPage(currentPage);
}

async function fitToPage() {
  if (!pdfDoc) return;
  const c = $('viewerContainer');
  const w = c.clientWidth - 40, h = c.clientHeight - 40;
  const vp = pageViews.get(1).page.getViewport({ scale: 1, rotation });
  currentScale = Math.max(0.25, Math.min(3, Math.min(w / vp.width, h / vp.height)));
  $('scaleSelect').value = 'auto';
  await refitPages();
  goToPage(currentPage);
}

async function setScale(newScale) {
  currentScale = Math.max(0.25, Math.min(5, newScale));
  $('scaleSelect').value = String(currentScale);
  await refitPages();
  goToPage(currentPage);
}

/* ── Navigation ── */
function goToPage(p) {
  p = Math.max(1, Math.min(totalPages, p));
  const el = $('page-' + p);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  currentPage = p;
  $('pageInput').value = p;
  savePage(p);
}

function updateCurrentPage() {
  const viewer = $('viewerContainer');
  let closest = 1, minDist = Infinity;
  pageViews.forEach((pv, i) => {
    const rect = pv.div.getBoundingClientRect();
    const dist = Math.abs(rect.top - viewer.getBoundingClientRect().top);
    if (dist < minDist) { minDist = dist; closest = i; }
  });
  if (closest !== currentPage) {
    currentPage = closest;
    $('pageInput').value = currentPage;
    savePage(currentPage);
  }
}

function savePage(page) {
  if (page === lastSavedPage) return;
  lastSavedPage = page;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { if (PAGE_KEY) localStorage.setItem(PAGE_KEY, String(page)); } catch {}
    try { window.parent.postMessage({ type: 'pdf-page-change', page, filePath }, '*'); } catch {}
  }, 400);
}

/* ── Hand tool ── */
function toggleHandTool() {
  handTool = !handTool;
  const container = $('viewerContainer');
  const btn = $('handToolBtn');
  if (handTool) {
    container.classList.add('grab');
    container.classList.remove('textSelect');
    btn.classList.add('active');
    container.style.overflow = 'hidden';
  } else {
    container.classList.remove('grab');
    container.classList.add('textSelect');
    btn.classList.remove('active');
    container.style.overflow = '';
  }
}

let dragStart = null;
$('viewerContainer').addEventListener('mousedown', e => {
  if (!handTool) return;
  dragStart = { x: e.clientX, y: e.clientY, scrollLeft: e.target.closest('#viewerContainer')?.scrollLeft || 0, scrollTop: e.target.closest('#viewerContainer')?.scrollTop || 0 };
});
document.addEventListener('mousemove', e => {
  if (!handTool || !dragStart) return;
  const container = $('viewerContainer');
  container.scrollLeft = dragStart.scrollLeft - (e.clientX - dragStart.x);
  container.scrollTop = dragStart.scrollTop - (e.clientY - dragStart.y);
});
document.addEventListener('mouseup', () => { dragStart = null; });

/* ── Toolbar events ── */
$('prevBtn').addEventListener('click', () => goToPage(currentPage - 1));
$('nextBtn').addEventListener('click', () => goToPage(currentPage + 1));
$('pageInput').addEventListener('change', e => goToPage(parseInt(e.target.value) || 1));
$('zoomInBtn').addEventListener('click', () => setScale(currentScale + 0.25));
$('zoomOutBtn').addEventListener('click', () => setScale(currentScale - 0.25));
$('scaleSelect').addEventListener('change', e => {
  if (e.target.value === 'auto') fitToWidth();
  else setScale(parseFloat(e.target.value));
});
$('fitWidthBtn').addEventListener('click', fitToWidth);
$('fitPageBtn').addEventListener('click', fitToPage);
$('rotateBtn').addEventListener('click', () => {
  rotation = (rotation + 90) % 360;
  refitPages().then(() => goToPage(currentPage));
});
$('handToolBtn').addEventListener('click', toggleHandTool);
$('printBtn').addEventListener('click', () => window.print());
$('downloadBtn').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = fileUrl; a.download = ''; a.target = '_blank'; a.click();
});
$('fullscreenBtn').addEventListener('click', () => {
  try { window.parent.postMessage({ type: 'pdf-fullscreen' }, '*'); } catch {}
});
$('closeBtn').addEventListener('click', () => {
  try { window.parent.postMessage({ type: 'pdf-close' }, '*'); } catch {}
});

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goToPage(currentPage - 1); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goToPage(currentPage + 1); }
  else if (e.key === '+' || e.key === '=') { e.preventDefault(); setScale(currentScale + 0.25); }
  else if (e.key === '-') { e.preventDefault(); setScale(currentScale - 0.25); }
  else if (e.key === 'Escape') { try { window.parent.postMessage({ type: 'pdf-close' }, '*'); } catch {} }
  else if (e.key === 'h' || e.key === 'H') { e.preventDefault(); toggleHandTool(); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); try { window.parent.postMessage({ type: 'pdf-fullscreen' }, '*'); } catch {} }
  else if (e.key === '0' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); fitToWidth(); }
});

/* ── Ctrl+Scroll zoom ── */
$('viewerContainer').addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    setScale(currentScale + delta);
  }
}, { passive: false });

/* ── Trackpad pinch zoom ── */
let lastTouchDist = 0;
$('viewerContainer').addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.hypot(dx, dy);
  }
}, { passive: true });

$('viewerContainer').addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    if (lastTouchDist > 0) {
      const scaleDelta = (dist - lastTouchDist) * 0.005;
      setScale(currentScale + scaleDelta);
    }
    lastTouchDist = dist;
  }
}, { passive: false });

$('viewerContainer').addEventListener('touchend', () => { lastTouchDist = 0; }, { passive: true });

/* ── Scroll tracking + lazy render ── */
$('viewerContainer').addEventListener('scroll', () => {
  updateCurrentPage();
  renderVisible();
});

observer = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    const i = Number(entry.target.dataset.page);
    if (entry.isIntersecting) renderPage(i);
    else if (i !== currentPage) clearPage(i);
  }
}, { root: $('viewerContainer'), rootMargin: '250% 0px' });

/* ── Auto-resize ── */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if ($('scaleSelect').value === 'auto') fitToWidth();
  }, 200);
});

/* ── Start ── */
if (fileUrl) loadPdf(fileUrl);
</script>
</body>
</html>
