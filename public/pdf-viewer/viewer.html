<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Viewer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1e293b; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#e2e8f0; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

.toolbar {
  display:flex; align-items:center; gap:6px; padding:6px 12px;
  background:#0f172a; border-bottom:1px solid #334155; flex-shrink:0;
  flex-wrap: wrap; min-height:42px;
}
.toolbar-group { display:flex; align-items:center; gap:3px; }
.toolbar-sep { width:1px; height:22px; background:#334155; margin:0 4px; }
.tb-btn {
  background:none; border:1px solid transparent; color:#94a3b8; cursor:pointer;
  width:32px; height:30px; border-radius:5px; display:inline-flex;
  align-items:center; justify-content:center; font-size:.8rem; transition:all .15s;
}
.tb-btn:hover { background:rgba(128,128,128,.15); border-color:rgba(128,128,128,.3); color:#e2e8f0; }
.tb-btn.active { background:rgba(59,130,246,.2); border-color:rgba(59,130,246,.5); color:#60a5fa; }
.tb-btn[title*="Close"] { color:#f87171; }
.tb-btn[title*="Close"]:hover { background:rgba(239,68,68,.2); color:#ef4444; }
.tb-input {
  width:50px; height:28px; background:#1e293b; border:1px solid #334155;
  border-radius:4px; color:#e2e8f0; text-align:center; font-size:.78rem; outline:none;
}
.tb-input:focus { border-color:#3b82f6; }
.tb-label { font-size:.7rem; color:#64748b; }
.tb-spacer { flex:1; }
#filename { font-size:.78rem; font-weight:600; color:#e2e8f0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
.pdf-container { flex:1; overflow:hidden; position:relative; background:#475569; }
#viewer { width:100%; height:100%; overflow:auto; }
#viewer::-webkit-scrollbar { width:8px; }
#viewer::-webkit-scrollbar-track { background:#1e293b; }
#viewer::-webkit-scrollbar-thumb { background:#475569; border-radius:4px; }
.page-container { margin:8px auto; box-shadow:0 2px 8px rgba(0,0,0,.4); background:#fff; position:relative; }
canvas { display:block; }
.annotationLayer, .textLayer { position:absolute; left:0; top:0; }

/* Annotation toolbar */
.anno-toolbar {
  display:none; align-items:center; gap:4px; padding:4px 12px;
  background:#1a2332; border-bottom:1px solid #334155; flex-shrink:0;
}
.anno-toolbar.show { display:flex; }
.anno-btn {
  background:none; border:1px solid transparent; color:#94a3b8; cursor:pointer;
  height:28px; padding:0 8px; border-radius:5px; display:inline-flex;
  align-items:center; gap:4px; font-size:.72rem; transition:all .15s;
}
.anno-btn:hover { background:rgba(128,128,128,.15); border-color:rgba(128,128,128,.3); color:#e2e8f0; }
.anno-btn.active { background:rgba(234,179,8,.2); border-color:rgba(234,179,8,.5); color:#facc15; }
.color-pick { width:24px; height:24px; border:none; border-radius:4px; cursor:pointer; background:none; padding:0; }
.color-pick::-webkit-color-swatch-wrapper { padding:1px; }
.color-pick::-webkit-color-swatch { border-radius:3px; border:none; }

.loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#1e293b; z-index:10; }
.spinner { width:36px; height:36px; border:3px solid #334155; border-top-color:#3b82f6; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.error-msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#f87171; font-size:.9rem; }
</style>
</head>
<body>

<div class="toolbar">
  <button class="tb-btn" id="btnClose" title="Close"><i class="fas fa-times"></i></button>
  <div class="toolbar-sep"></div>
  <div class="toolbar-group">
    <button class="tb-btn" id="btnPrev" title="Previous Page"><i class="fas fa-chevron-left"></i></button>
    <input type="number" class="tb-input" id="pageInput" min="1" value="1">
    <span class="tb-label" id="pageTotal">/ 1</span>
    <button class="tb-btn" id="btnNext" title="Next Page"><i class="fas fa-chevron-right"></i></button>
  </div>
  <div class="toolbar-sep"></div>
  <div class="toolbar-group">
    <button class="tb-btn" id="btnZoomOut" title="Zoom Out"><i class="fas fa-minus"></i></button>
    <input type="number" class="tb-input" id="zoomInput" min="25" max="500" value="100" style="width:55px">
    <span class="tb-label">%</span>
    <button class="tb-btn" id="btnZoomIn" title="Zoom In"><i class="fas fa-plus"></i></button>
    <button class="tb-btn" id="btnFitWidth" title="Fit Width"><i class="fas fa-arrows-alt-h"></i></button>
    <button class="tb-btn" id="btnFitPage" title="Fit Page"><i class="fas fa-expand"></i></button>
  </div>
  <div class="toolbar-sep"></div>
  <div class="toolbar-group">
    <button class="tb-btn" id="btnRotate" title="Rotate"><i class="fas fa-redo"></i></button>
  </div>
  <div class="toolbar-sep"></div>
  <div class="toolbar-group">
    <button class="tb-btn" id="btnAnno" title="Annotations"><i class="fas fa-pen-nib"></i></button>
  </div>
  <div class="tb-spacer"></div>
  <span id="filename"></span>
  <div class="toolbar-sep"></div>
  <button class="tb-btn" id="btnDownload" title="Download PDF" style="width:auto;padding:0 10px;gap:4px;font-size:.72rem"><i class="fas fa-download"></i> Download</button>
</div>

<div class="anno-toolbar" id="annoToolbar">
  <button class="anno-btn" data-tool="highlight" title="Highlight"><i class="fas fa-highlighter"></i> Highlight</button>
  <button class="anno-btn" data-tool="underline" title="Underline"><i class="fas fa-underline"></i> Underline</button>
  <button class="anno-btn" data-tool="strikeout" title="Strikeout"><i class="fas fa-strikethrough"></i> Strike</button>
  <div class="toolbar-sep"></div>
  <button class="anno-btn" data-tool="freehand" title="Freehand Draw"><i class="fas fa-pen"></i> Draw</button>
  <button class="anno-btn" data-tool="text" title="Text Note"><i class="fas fa-comment"></i> Text</button>
  <button class="anno-btn" data-tool="arrow" title="Arrow"><i class="fas fa-long-arrow-alt-right"></i> Arrow</button>
  <button class="anno-btn" data-tool="rectangle" title="Rectangle"><i class="far fa-square"></i> Rect</button>
  <div class="toolbar-sep"></div>
  <input type="color" class="color-pick" id="annoColor" value="#FFEB3B" title="Annotation Color">
  <button class="anno-btn" id="btnClearAnno" title="Clear All Annotations"><i class="fas fa-eraser"></i> Clear</button>
</div>

<div class="pdf-container">
  <div class="loading" id="loading"><div class="spinner"></div></div>
  <div id="viewer"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs" type="module"></script>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.worker.min.mjs';

const params = new URLSearchParams(window.location.search);
const hashParams = new URLSearchParams(window.location.hash.slice(1));
const fileUrl = params.get('file');
const fileName = params.get('name') || 'document.pdf';
const filePath = params.get('path') || '';
const initialPage = parseInt(hashParams.get('page')) || 1;
let pdfDoc = null, currentPage = 1, totalPages = 0, scale = 1.5, rotation = 0;
let annoMode = null, annoColor = '#FFEB3B', annotations = [];
let lastSavedPage = 0, saveTimer = null;

const PAGE_STORAGE_KEY = filePath ? `pdf-page-${filePath}` : '';

document.getElementById('filename').textContent = decodeURIComponent(fileName);

if (!fileUrl) {
  document.getElementById('loading').innerHTML = '<div class="error-msg">No PDF URL provided</div>';
  throw new Error('No file URL');
}

async function loadPdf(url) {
  try {
    const loadingTask = pdfjsLib.getDocument({ url, corsOrigin: 'anonymous' });
    pdfDoc = await loadingTask.promise;
    totalPages = pdfDoc.numPages;
    document.getElementById('pageTotal').textContent = `/ ${totalPages}`;
    document.getElementById('pageInput').max = totalPages;
    document.getElementById('loading').style.display = 'none';
    renderAllPages();
  } catch (e) {
    document.getElementById('loading').innerHTML = `<div class="error-msg"><div>Failed to load PDF</div><div style="font-size:.7rem;margin-top:8px;color:#94a3b8">${e.message}</div></div>`;
  }
}

async function renderAllPages() {
  const viewer = document.getElementById('viewer');
  viewer.innerHTML = '';
  for (let i = 1; i <= totalPages; i++) {
    const page = await pdfDoc.getPage(i);
    const vp = page.getViewport({ scale, rotation });
    const div = document.createElement('div');
    div.className = 'page-container';
    div.id = `page-${i}`;
    div.style.width = vp.width + 'px';
    div.style.height = vp.height + 'px';
    const canvas = document.createElement('canvas');
    canvas.width = vp.width;
    canvas.height = vp.height;
    div.appendChild(canvas);
    viewer.appendChild(div);
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    renderAnnotations(page, div, vp);
  }
  const target = Math.max(1, Math.min(totalPages, initialPage));
  goToPage(target);
}

function renderAnnotations(pdfPage, container, viewport) {
  pdfPage.getAnnotations().then(annos => {
    if (!annos || !annos.length) return;
    const layer = document.createElement('div');
    layer.className = 'annotationLayer';
    layer.style.width = viewport.width + 'px';
    layer.style.height = viewport.height + 'px';
    container.appendChild(layer);
    annos.forEach(a => {
      if (a.subtype === 'Widget') return;
      const el = document.createElement('div');
      const rect = pdfjsLib.Util.normalizeRect([a.rect[0], a.rect[1], a.rect[2], a.rect[3], ]);
      el.style.position = 'absolute';
      el.style.left = rect[0] + 'px';
      el.style.top = (viewport.height - rect[3]) + 'px';
      el.style.width = (rect[2] - rect[0]) + 'px';
      el.style.height = (rect[3] - rect[1]) + 'px';
      if (a.subtype === 'Text') {
        el.innerHTML = `<div style="background:#fef3c7;border:1px solid #f59e0b;border-radius:3px;padding:2px 4px;font-size:10px;color:#92400e;width:100%;height:100%">${a.contents || 'Note'}</div>`;
      }
      layer.appendChild(el);
    });
  });
}

function updateCurrentPage() {
  const viewer = document.getElementById('viewer');
  const pages = viewer.querySelectorAll('.page-container');
  let closest = 1, minDist = Infinity;
  pages.forEach((p, i) => {
    const r = p.getBoundingClientRect();
    const dist = Math.abs(r.top);
    if (dist < minDist) { minDist = dist; closest = i + 1; }
  });
  currentPage = closest;
  document.getElementById('pageInput').value = currentPage;
  savePageToStorage(currentPage);
}

function savePageToStorage(page) {
  if (page === lastSavedPage) return;
  lastSavedPage = page;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      if (PAGE_STORAGE_KEY) localStorage.setItem(PAGE_STORAGE_KEY, String(page));
    } catch {}
    try { window.parent.postMessage({ type: 'pdf-page-change', page, filePath }, '*'); } catch {}
  }, 500);
}

function goToPage(p) {
  p = Math.max(1, Math.min(totalPages, p));
  const el = document.getElementById(`page-${p}`);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
  currentPage = p;
  document.getElementById('pageInput').value = p;
  savePageToStorage(p);
}

async function setScale(newScale) {
  scale = Math.max(0.25, Math.min(5, newScale));
  document.getElementById('zoomInput').value = Math.round(scale * 100);
  await renderAllPages();
  goToPage(currentPage);
}

/* Events */
document.getElementById('btnPrev').onclick = () => goToPage(currentPage - 1);
document.getElementById('btnNext').onclick = () => goToPage(currentPage + 1);
document.getElementById('pageInput').onchange = (e) => goToPage(parseInt(e.target.value) || 1);
document.getElementById('btnZoomIn').onclick = () => setScale(scale + 0.25);
document.getElementById('btnZoomOut').onclick = () => setScale(scale - 0.25);
document.getElementById('zoomInput').onchange = (e) => setScale(parseInt(e.target.value) / 100);
document.getElementById('btnRotate').onclick = () => { rotation = (rotation + 90) % 360; renderAllPages().then(() => goToPage(currentPage)); };
document.getElementById('btnFitWidth').onclick = () => {
  const w = document.querySelector('.pdf-container').clientWidth - 20;
  const page = pdfDoc ? pdfDoc.getPage(1) : null;
  if (page) page.then(p => { const vp = p.getViewport({ scale: 1, rotation }); setScale(w / vp.width); });
};
document.getElementById('btnFitPage').onclick = () => {
  const c = document.querySelector('.pdf-container');
  const w = c.clientWidth - 20, h = c.clientHeight - 20;
  const page = pdfDoc ? pdfDoc.getPage(1) : null;
  if (page) page.then(p => { const vp = p.getViewport({ scale: 1, rotation }); setScale(Math.min(w / vp.width, h / vp.height)); });
};
document.getElementById('btnDownload').onclick = () => {
  const a = document.createElement('a');
  a.href = fileUrl;
  a.download = decodeURIComponent(fileName);
  a.target = '_blank';
  a.click();
};
document.getElementById('btnClose').onclick = () => { window.parent.postMessage({ type: 'pdf-close' }, '*'); };

/* Annotations toggle */
document.getElementById('btnAnno').onclick = () => {
  const tb = document.getElementById('annoToolbar');
  tb.classList.toggle('show');
  document.getElementById('btnAnno').classList.toggle('active');
};
document.querySelectorAll('.anno-btn[data-tool]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.anno-btn[data-tool]').forEach(b => b.classList.remove('active'));
    if (annoMode === btn.dataset.tool) { annoMode = null; }
    else { annoMode = btn.dataset.tool; btn.classList.add('active'); }
    document.getElementById('viewer').style.cursor = annoMode ? 'crosshair' : 'default';
  };
});
document.getElementById('annoColor').oninput = (e) => { annoColor = e.target.value; };
document.getElementById('btnClearAnno').onclick = () => {
  document.querySelectorAll('#viewer .user-annotation').forEach(el => el.remove());
  annotations = [];
};

/* User drawing on pages */
document.getElementById('viewer').addEventListener('mousedown', (e) => {
  if (!annoMode || !['freehand','arrow','rectangle'].includes(annoMode)) return;
  const pageEl = e.target.closest('.page-container');
  if (!pageEl) return;
  const rect = pageEl.getBoundingClientRect();
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.classList.add('user-annotation');
  svg.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:20';
  pageEl.appendChild(svg);
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  let path;
  if (annoMode === 'freehand') {
    path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('stroke', annoColor);
    path.setAttribute('stroke-width', '2.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('d', `M${x},${y}`);
    svg.appendChild(path);
  } else if (annoMode === 'rectangle') {
    path = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    path.setAttribute('stroke', annoColor);
    path.setAttribute('stroke-width', '2');
    path.setAttribute('fill', annoColor + '20');
    path.setAttribute('x', x); path.setAttribute('y', y);
    path.setAttribute('width', 0); path.setAttribute('height', 0);
    svg.appendChild(path);
  } else if (annoMode === 'arrow') {
    path = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    path.setAttribute('stroke', annoColor);
    path.setAttribute('stroke-width', '2.5');
    path.setAttribute('marker-end', '');
    path.setAttribute('x1', x); path.setAttribute('y1', y);
    path.setAttribute('x2', x); path.setAttribute('y2', y);
    svg.appendChild(path);
  }
  const startX = x, startY = y;
  const onMove = (ev) => {
    const cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
    if (annoMode === 'freehand') path.setAttribute('d', path.getAttribute('d') + ` L${cx},${cy}`);
    else if (annoMode === 'rectangle') { path.setAttribute('width', cx - startX); path.setAttribute('height', cy - startY); }
    else if (annoMode === 'arrow') { path.setAttribute('x2', cx); path.setAttribute('y2', cy); }
  };
  const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

/* Text annotation */
document.getElementById('viewer').addEventListener('dblclick', (e) => {
  if (annoMode !== 'text') return;
  const pageEl = e.target.closest('.page-container');
  if (!pageEl) return;
  const rect = pageEl.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const div = document.createElement('div');
  div.className = 'user-annotation';
  div.style.cssText = `position:absolute;left:${x}px;top:${y}px;z-index:20;background:${annoColor}22;border:1px solid ${annoColor};border-radius:3px;padding:4px 6px;font-size:11px;color:#1e293b;min-width:60px;max-width:200px;cursor:move`;
  div.contentEditable = true;
  div.textContent = 'Note';
  pageEl.appendChild(div);
  div.focus();
  const range = document.createRange();
  range.selectNodeContents(div);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
});

/* Scroll tracking */
document.getElementById('viewer').addEventListener('scroll', updateCurrentPage);

/* Keyboard */
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.contentEditable === 'true') return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goToPage(currentPage - 1); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goToPage(currentPage + 1); }
  else if (e.key === '+' || e.key === '=') { e.preventDefault(); setScale(scale + 0.25); }
  else if (e.key === '-') { e.preventDefault(); setScale(scale - 0.25); }
});

loadPdf(fileUrl);
</script>
</body>
</html>
